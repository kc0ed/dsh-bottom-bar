# dsh-bottom-bar bundle patch: inserts the bottom-bar plugin row over the
# profile root (same mechanism as dsh-base). Consumed when this package is
# listed in a profile's dsh.profile.bundles. `name` is the npm package name
# (the loader resolves it from the profile's node_modules).
- insert:
    - id: dsh-bottom-bar
      name: '@kc0ed/dsh-bottom-bar'
